<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fortune Investment Services — Insurance Proposal Workspace</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root{
  --color-bg:#f4f6f9;
  --color-surface:#ffffff;
  --color-text:#1e293b;
  --color-divider:color-mix(in srgb, #1e293b 10%, transparent);

  --color-neutral-100:#f8fafc; --color-neutral-200:#f1f5f9; --color-neutral-300:#e2e8f0;
  --color-neutral-400:#cbd5e1; --color-neutral-500:#94a3b8; --color-neutral-600:#64748b;
  --color-neutral-700:#475569; --color-neutral-800:#334155; --color-neutral-900:#0f172a;

  --color-accent:#1e50a2; --color-accent-100:#eff6ff; --color-accent-200:#dbeafe;
  --color-accent-300:#bfdbfe; --color-accent-400:#93c5fd; --color-accent-500:#3b82f6;
  --color-accent-600:#1e50a2; --color-accent-700:#1d4ed8; --color-accent-800:#1e40af; --color-accent-900:#1e3a8a;

  --color-accent-2:#10b981; --color-accent-2-100:#ecfdf5; --color-accent-2-200:#d1fae5;
  --color-accent-2-300:#a7f3d0; --color-accent-2-400:#34d399; --color-accent-2-500:#10b981;
  --color-accent-2-600:#059669; --color-accent-2-700:#047857; --color-accent-2-800:#065f46; --color-accent-2-900:#064e3b;

  --font-heading:"Inter",system-ui,sans-serif; --font-heading-weight:600; --font-body:"Inter",system-ui,sans-serif;

  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px;
  --radius-sm:6px; --radius-md:10px; --radius-lg:16px;

  --shadow-sm: 0 1px 2px rgba(15,23,42,0.05);
  --shadow-md: 0 4px 12px rgba(15,23,42,0.08);
  --shadow-lg: 0 12px 32px rgba(15,23,42,0.14);
}
*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:14.5px;line-height:1.55;font-weight:400;}
h1,h2,h3,h4,h5,h6{font-family:var(--font-heading);font-weight:var(--font-heading-weight);line-height:1.25;letter-spacing:-0.015em;margin:0 0 var(--space-2);}
h1{font-size:32px;} h2{font-size:26px;} h3{font-size:20px;} h4{font-size:17px;} h5{font-size:15px;}
h6{font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-neutral-500);}
p{margin:0 0 var(--space-3);}
a{color:var(--color-accent);text-decoration:none;}
a:hover{color:var(--color-accent-700);}
img{display:block;max-width:100%;}
.text-muted{color:var(--color-neutral-500);}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--color-neutral-300);border-radius:4px;}

.hr{height:1px;border:0;margin:var(--space-4) 0;background:var(--color-divider);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-decoration:none;
  font-family:var(--font-heading);font-weight:600;font-size:13.5px;line-height:1.2;color:var(--color-text);
  background:transparent;border:1px solid transparent;padding:8px 16px;border-radius:var(--radius-md);transition:all 0.15s ease;}
.btn:disabled{opacity:0.45;cursor:not-allowed;}
.btn-primary{color:#fff;background:var(--color-accent-600);border-color:var(--color-accent-600);}
.btn-primary:hover{background:var(--color-accent-700);}
.btn-secondary{border-color:var(--color-neutral-300);background:var(--color-surface);}
.btn-secondary:hover{background:var(--color-neutral-100);border-color:var(--color-neutral-400);}
.btn-icon{width:36px;height:36px;padding:0;border-radius:var(--radius-md);}
.btn-block{width:100%;margin-top:var(--space-2);}

.field>label{display:block;font-size:12px;font-weight:500;margin-bottom:4px;color:var(--color-neutral-700);}
.input{width:100%;min-height:38px;padding:8px 12px;font:inherit;font-size:13.5px;color:var(--color-text);
  background:var(--color-surface);border:1px solid var(--color-neutral-300);border-radius:var(--radius-md);transition:border-color 0.15s ease;}
.input:hover{border-color:var(--color-neutral-400);}
.input:focus-visible{border-color:var(--color-accent);outline:none;}
textarea.input{min-height:75px;resize:vertical;}

.radio{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;}
.radio input{position:absolute;opacity:0;width:0;height:0;}
.radio .dot{width:16px;height:16px;flex:none;border-radius:50%;border:1.5px solid var(--color-neutral-300);background:var(--color-surface);}
.radio:hover .dot{border-color:var(--color-accent);}
.radio input:checked + .dot{border-color:var(--color-accent);background:var(--color-accent);box-shadow:inset 0 0 0 3px var(--color-surface);}

.seg{display:inline-flex;overflow:hidden;border:1px solid var(--color-neutral-300);border-radius:var(--radius-md);background:var(--color-neutral-100);padding:2px;}
.seg-opt{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;font-size:12.5px;font-weight:500;cursor:pointer;border-radius:var(--radius-sm);color:var(--color-neutral-700);transition:all 0.15s ease;}
.seg-opt input{position:absolute;opacity:0;width:0;height:0;}
.seg-opt.active{color:#fff;background:var(--color-accent-600);box-shadow:var(--shadow-sm);}
.seg-opt:not(.active):hover{background:rgba(255,255,255,0.6);}

.card{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-4);border-radius:var(--radius-lg);background:var(--color-surface);border:1px solid var(--color-divider);}
.card-kicker{font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-accent-700);font-weight:600;}
.card-title{font-family:var(--font-heading);font-weight:600;font-size:16.5px;line-height:1.3;}
.card-body{margin:0;font-size:13px;color:var(--color-neutral-600);flex:1;}
.card-meta{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--color-neutral-500);}
.elev-sm{box-shadow:var(--shadow-sm);}
.elev-md{box-shadow:var(--shadow-md);}
.elev-lg{box-shadow:var(--shadow-lg);}
.card.clickable{cursor:pointer;transition:transform 0.15s ease, box-shadow 0.15s ease;}
.card.clickable:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}

.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:500;letter-spacing:0.01em;padding:3px 10px;border-radius:20px;white-space:nowrap;}
.tag-accent{background:var(--color-accent-100);color:var(--color-accent-800);}
.tag-accent-2{background:var(--color-accent-2-100);color:var(--color-accent-2-800);}
.tag-neutral{background:var(--color-neutral-200);color:var(--color-neutral-800);}
.tag-outline{border:1px solid var(--color-accent-300);color:var(--color-accent-700);background:var(--color-accent-100);}

.table{width:100%;border-collapse:collapse;font-size:13px;}
.table th{text-align:left;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-neutral-500);padding:10px 14px;background:var(--color-neutral-100);}
.table td{padding:12px 14px;border-bottom:1px solid var(--color-divider);}
.table tbody tr:hover{background:var(--color-neutral-100);}

.dialog-backdrop{position:fixed;inset:0;display:grid;place-items:center;padding:var(--space-4);background:rgba(15,23,42,0.5);backdrop-filter:blur(4px);z-index:60;}
.dialog{width:min(460px,100%);display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-6);border-radius:var(--radius-lg);background:var(--color-surface);box-shadow:var(--shadow-lg);max-height:88vh;overflow-y:auto;}
.dialog-title{font-family:var(--font-heading);font-weight:600;font-size:19px;}
.dialog-body{font-size:13.5px;}
.dialog-actions{display:flex;justify-content:flex-end;gap:var(--space-2);margin-top:var(--space-2);}

.nav{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-3) var(--space-6);border-bottom:1px solid var(--color-divider);flex-wrap:wrap;row-gap:var(--space-2);background:var(--color-surface);}
.nav-brand{display:flex;align-items:center;gap:12px;margin-right:auto;}

.cat-bar{display:flex;align-items:center;gap:var(--space-3);padding:10px var(--space-6);border-bottom:1px solid var(--color-divider);background:var(--color-neutral-900);flex-wrap:wrap;row-gap:6px;}
.cat-bar-label{font-size:12px;color:rgba(255,255,255,0.7);white-space:nowrap;}
.cat-bar-opts{display:flex;gap:8px;flex-wrap:wrap;}
.cat-opt{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;border:1px solid rgba(255,255,255,0.2);background:transparent;color:rgba(255,255,255,0.85);font-family:var(--font-heading);font-weight:600;font-size:12.5px;cursor:pointer;transition:all 0.15s ease;}
.cat-opt:hover{background:rgba(255,255,255,0.12);color:#fff;}
.cat-opt.active{background:#fff;color:var(--color-accent-900);border-color:#fff;}

.t-edit{outline:1.5px dashed var(--color-accent-500);outline-offset:2px;cursor:pointer;border-radius:3px;}
.t-edit:hover{background:rgba(59,130,246,0.12);}
.text-edit-banner{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:60;background:var(--color-neutral-900);color:#fff;font-size:12.5px;padding:8px 18px;border-radius:30px;box-shadow:0 8px 24px rgba(0,0,0,0.3);display:flex;gap:12px;align-items:center;}
.text-edit-banner button{background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.3);color:#fff;border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer;}

.app-root{min-height:100vh;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);display:flex;flex-direction:column;}
.body-flex{display:flex;flex:1;min-height:0;}
aside.sidebar{width:300px;flex:none;border-right:1px solid var(--color-divider);padding:var(--space-4);overflow-y:auto;max-height:calc(100vh - 64px);position:sticky;top:0;align-self:flex-start;background:var(--color-surface);}
main#main{flex:1;min-width:0;padding:var(--space-6) var(--space-8) 80px;overflow-y:auto;}
.nav-item-btn{display:block;width:100%;text-align:left;background:transparent;border:none;border-radius:var(--radius-md);padding:8px;margin-bottom:3px;color:var(--color-text);cursor:pointer;transition:background 0.15s ease;}
.nav-item-btn:hover{background:var(--color-neutral-100);}

.toast{position:fixed;bottom:24px;right:24px;background:var(--color-surface);border:1px solid var(--color-accent);color:var(--color-text);padding:12px 20px;border-radius:var(--radius-md);box-shadow:var(--shadow-lg);font-size:13.5px;z-index:70;max-width:360px;line-height:1.4;}
.toast.toast-error{border-color:#ef4444;background:#fef2f2;color:#991b1b;}

.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:var(--space-4);}
.grid-cards-sm{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:var(--space-4);}
.grid-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:var(--space-4);margin-bottom:var(--space-6);}

/* Dedicated Section Styling for Scheme Content Blocks */
.content-section{background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-lg);padding:var(--space-6);margin-bottom:var(--space-6);box-shadow:var(--shadow-sm);}
.content-section-head{display:flex;align-items:center;gap:12px;margin-bottom:var(--space-4);padding-bottom:var(--space-3);border-bottom:1.5px solid var(--color-neutral-200);}
.content-section-icon{width:36px;height:36px;border-radius:10px;background:var(--color-accent-100);color:var(--color-accent-700);display:grid;place-items:center;font-size:18px;flex:none;}
.content-section-title{font-size:18px;font-weight:600;margin:0;}
.content-section-sub{font-size:12px;color:var(--color-neutral-500);margin-top:2px;}

/* Quick Jump Sticky Navigation Pill Bar */
.jump-nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,0.92);backdrop-filter:blur(8px);border:1px solid var(--color-divider);border-radius:30px;padding:6px 12px;margin-bottom:var(--space-6);display:flex;gap:8px;overflow-x:auto;box-shadow:var(--shadow-sm);}
.jump-nav-item{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:500;color:var(--color-neutral-700);text-decoration:none;white-space:nowrap;transition:all 0.15s ease;}
.jump-nav-item:hover{background:var(--color-accent-100);color:var(--color-accent-800);}

/* Financial & Parameter Grid */
.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:var(--space-2);}
.detail-grid > div{background:var(--color-neutral-100);padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);border:1px solid var(--color-neutral-200);}
.detail-grid .k{font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;color:var(--color-neutral-500);font-weight:600;}
.detail-grid .v{font-weight:600;font-size:14px;color:var(--color-neutral-900);}

.feature-list{list-style:none;margin:0;padding:0;}
.feature-list li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--color-divider);font-size:13.5px;}
.feature-list li:last-child{border-bottom:none;}
.feature-list li .plus{color:var(--color-accent-2-600);font-weight:700;flex:none;}

.dash-hero{border-radius:var(--radius-lg);padding:28px 32px;margin-bottom:var(--space-6);color:#fff;
  background:linear-gradient(125deg, var(--color-accent-900) 0%, var(--color-accent-700) 60%, var(--color-accent-2-700) 130%);
  display:flex;justify-content:space-between;align-items:center;gap:var(--space-4);flex-wrap:wrap;box-shadow:var(--shadow-md);}
.dash-hero h2{margin-bottom:4px;color:#fff;}
.dash-hero p{margin:0;opacity:0.88;font-size:13px;max-width:540px;}

.stat-card{position:relative;overflow:hidden;padding:var(--space-4);border-radius:var(--radius-lg);background:var(--color-surface);border:1px solid var(--color-divider);box-shadow:var(--shadow-sm);}
.stat-card .stat-icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:17px;margin-bottom:var(--space-2);}
.stat-card .stat-value{font-size:28px;font-weight:700;font-family:var(--font-heading);letter-spacing:-0.02em;}
.stat-card .stat-label{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--color-neutral-500);margin-top:2px;}
.stat-blue .stat-icon{background:var(--color-accent-100);color:var(--color-accent-700);}
.stat-green .stat-icon{background:var(--color-accent-2-100);color:var(--color-accent-2-700);}
.stat-amber .stat-icon{background:#fef3c7;color:#d97706;}
.stat-red .stat-icon{background:#fee2e2;color:#dc2626;}

.status-bar{display:flex;width:100%;height:10px;border-radius:10px;overflow:hidden;background:var(--color-neutral-200);margin:var(--space-2) 0 var(--space-4);}
.status-bar span{height:100%;}
.status-bar .seg-purchased{background:var(--color-accent-2-600);}
.status-bar .seg-sent{background:var(--color-accent-500);}
.status-bar .seg-declined{background:#ef4444;}
.status-bar .seg-draft{background:var(--color-neutral-400);}
.status-legend{display:flex;gap:var(--space-4);flex-wrap:wrap;font-size:12px;margin-bottom:var(--space-6);}
.status-legend .dot-sq{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px;}

@media (max-width: 880px){
  aside.sidebar{position:static;max-height:none;width:100%;border-right:none;border-bottom:1px solid var(--color-divider);}
  .body-flex{flex-direction:column;}
  .detail-grid{grid-template-columns:repeat(2,1fr);}
  .cat-bar{padding:10px var(--space-4);}
  .cat-bar-label{width:100%;}
  .cat-opt{padding:6px 12px;font-size:12px;}
}

.login-wrap{min-height:100vh;display:flex;align-items:stretch;justify-content:center;background:
    radial-gradient(1200px 600px at 10% -10%, rgba(255,255,255,0.12), transparent 60%),
    linear-gradient(135deg, var(--color-accent-900) 0%, var(--color-accent-700) 50%, var(--color-accent-500) 100%);
  padding:var(--space-6);}
.login-shell{display:flex;width:min(940px,100%);margin:auto;border-radius:calc(var(--radius-lg) * 1.2);overflow:hidden;box-shadow:0 24px 60px rgba(15,23,42,0.4);}
.login-brand-panel{flex:1.1;min-width:290px;padding:44px;color:#fff;
  background:linear-gradient(155deg, var(--color-accent-900) 0%, var(--color-accent-700) 60%, var(--color-accent-2-700) 130%);
  display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;}
.login-brand-tagline{font-size:24px;line-height:1.3;font-weight:600;margin-top:32px;}
.login-brand-points{list-style:none;margin:24px 0 0;padding:0;display:flex;flex-direction:column;gap:12px;}
.login-brand-points li{display:flex;align-items:center;gap:10px;font-size:13.5px;opacity:0.92;}
.login-brand-points .ico{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,0.16);display:grid;place-items:center;font-size:12px;}
.login-brand-about{font-size:12px;line-height:1.6;opacity:0.88;margin-top:24px;padding-top:20px;border-top:1px solid rgba(255,255,255,0.2);}
.login-brand-about h6{color:#fff;opacity:0.75;margin-bottom:6px;}
.login-brand-stats{display:flex;gap:16px;margin-top:14px;}
.login-brand-stats .num{font-family:var(--font-heading);font-weight:700;font-size:18px;}
.login-brand-stats .lbl{font-size:10px;opacity:0.75;}
.login-form-panel{flex:1;min-width:310px;background:var(--color-surface);padding:48px 40px;display:flex;flex-direction:column;justify-content:center;}
.login-card{width:100%;max-width:340px;margin:0 auto;padding:0;border:none;box-shadow:none;background:transparent;}
.login-error{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:var(--radius-md);padding:8px 12px;font-size:12.5px;margin-bottom:var(--space-3);}
@media (max-width: 760px){ .login-brand-panel{display:none;} .login-form-panel{padding:36px 24px;} }

.badge-role{font-size:10px;letter-spacing:0.05em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:var(--color-accent-100);color:var(--color-accent-800);font-weight:600;}
.badge-role.admin{background:var(--color-accent-2-100);color:var(--color-accent-2-800);}

.prop-cover{position:relative;overflow:hidden;color:#fff;text-align:center;border-radius:var(--radius-lg);
  padding:44px 32px 36px;margin-bottom:var(--space-6);max-width:920px;
  background:linear-gradient(135deg, var(--color-accent-900) 0%, var(--color-accent-700) 65%, var(--color-accent-2-700) 130%);
  box-shadow:var(--shadow-md);}
.prop-cover .prop-logo-badge{display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.95);border-radius:12px;padding:10px 20px;margin-bottom:20px;}
.prop-cover .prop-kicker{display:inline-block;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.3);padding:4px 14px;border-radius:20px;margin-bottom:12px;font-weight:600;}
.prop-cover h1{font-size:32px;color:#fff;}
.prop-cover .prop-sub{opacity:0.88;font-size:13.5px;margin-bottom:20px;}
.prop-cover .prop-meta{display:inline-grid;grid-template-columns:repeat(2,auto);gap:8px 36px;text-align:left;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);border-radius:12px;padding:16px 28px;font-size:13px;}
.prop-cover .prop-meta b{display:block;font-size:14px;font-weight:600;}
.prop-cover .prop-meta .k{opacity:0.75;font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;}

.prop-section-head{display:flex;align-items:center;gap:12px;margin:var(--space-8) 0 var(--space-4);padding-bottom:var(--space-2);border-bottom:2px solid var(--color-accent-600);}
.prop-section-head:first-of-type{margin-top:var(--space-6);}
.prop-section-icon{font-size:24px;}

.scheme-prop-card{position:relative;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--color-divider);
  background:var(--color-surface);box-shadow:var(--shadow-md);}
.scheme-prop-card .sp-band{height:6px;background:linear-gradient(90deg, var(--color-accent-600), var(--color-accent-2-500));}
.scheme-prop-card .sp-index{width:32px;height:32px;border-radius:8px;background:var(--color-accent-100);color:var(--color-accent-800);
  display:grid;place-items:center;font-weight:700;font-family:var(--font-heading);font-size:14px;flex:none;}
.scheme-prop-card .sp-metric{border-radius:8px;background:var(--color-neutral-100);padding:10px 14px;}
.scheme-prop-card .feature-list li{border-bottom:1px dashed var(--color-divider);}

.prop-footer-band{max-width:920px;border-radius:var(--radius-md);background:var(--color-neutral-900);color:#fff;
  padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);flex-wrap:wrap;font-size:12.5px;}

@media print{
  .no-print{display:none !important;}

function ageFactor(age){
  age = Number(age)||30;
  if(age<18) return 0.5;
  if(age<=25) return 0.75;
  if(age<=35) return 1.0;
  if(age<=45) return 1.35;
  if(age<=55) return 1.9;
  if(age<=65) return 2.7;
  if(age<=75) return 3.6;
  return 4.5;
}
function estimatePremium(scheme, {age, sumInsuredLakhs}){
  if(!scheme.ratePerLakh) return null;
  const raw = scheme.ratePerLakh * (Number(sumInsuredLakhs)||5) * ageFactor(age);
  const annual = Math.round(raw/100)*100;
  return { annual, monthly: Math.round(annual/12) };
}

function termAgeFactor(age){
  age = Number(age)||30;
  if(age<25) return 0.85;
  if(age<=30) return 1.0;
  if(age<=35) return 1.3;
  if(age<=40) return 1.75;
  if(age<=45) return 2.4;
  if(age<=50) return 3.3;
  if(age<=55) return 4.5;
  if(age<=60) return 6.0;
  return 8.0;
}
function estimateTermPremium(scheme, {age, coverLakhs, smoker}){
  if(!scheme.termRatePerLakh) return null;
  const raw = scheme.termRatePerLakh * (Number(coverLakhs)||100) * termAgeFactor(age) * (smoker ? 1.6 : 1);
  const annual = Math.round(raw/100)*100;
  return { annual, monthly: Math.round(annual/12) };
}

async function detectStorageMode(){

async function remoteGet(key){
  try{
    const r = await fetch(REMOTE_STORAGE_PATH + '?key=' + encodeURIComponent(key), { headers: { 'x-app-token': REMOTE_APP_TOKEN } });
    if(!r.ok) return null;
    const d = await r.json();
    return (d.value === null || d.value === undefined) ? null : JSON.parse(d.value);
  }catch(e){ return null; }

async function remoteSet(key, value){

  if(remoteStorageAvailable){ return remoteGet(key); }
  try{
    const raw = localStorage.getItem(localKeyName(key));
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }

function parseMaxSILakh(s){
  const matches = [...String(s).matchAll(/₹?\s?([\d.]+)\s*(l|cr)/gi)];
  if(!matches.length) return 0;
  let max = 0;
  matches.forEach(m=>{ let v = parseFloat(m[1]); if(/cr/i.test(m[2])) v *= 100; if(v > max) max = v; });
  return max;
}
function parseMaxNetwork(s){
  const nums = (String(s).match(/[\d,]+/g) || []).map(x => parseInt(x.replace(/,/g,''), 10)).filter(n => !isNaN(n));
  if(!nums.length) return Infinity;
  return Math.max(...nums);
}
function bySearch(s){
  const t = (state.search || '').toLowerCase();
  if(!t) return true;
  return s.insurer.toLowerCase().includes(t) || s.plan.toLowerCase().includes(t);
}
function passesFilters(s){
  const minSI = Number(state.filterMinSI) || 0;
  const minNet = Number(state.filterMinNetwork) || 0;
  if(minSI > 0 && parseMaxSILakh(s.sumInsured) < minSI) return false;
  if(state.filterNoCap && !/no cap/i.test(s.roomRent)) return false;
  if(minNet > 0 && parseMaxNetwork(s.network) < minNet) return false;
  if(state.favouritesOnly && !state.favIds.includes(s.id)) return false;
  return true;
}
function csrNum(s){ const m = (s.csr.match(/(\d+)/g) || []).map(Number); return m.length ? Math.max(...m) : 0; }
function estAnnual(s){
  const cat = s.category || 'health';
  if(cat === 'health') return estimatePremium(s, { age: state.calcAge, sumInsuredLakhs: Number(state.calcSI) });
  if(cat === 'term') return estimateTermPremium(s, { age: state.calcAge, coverLakhs: Number(state.calcCover), smoker: !!state.calcSmoker });
  return null;
}
function sortedFilteredSchemes(){
  let items = SCHEMES.filter(s => (s.category||'health') === state.category && bySearch(s) && passesFilters(s));
  const by = state.sortBy;
  if(by === 'csr') items = items.slice().sort((a,b) => csrNum(b) - csrNum(a));
  else if(by === 'network') items = items.slice().sort((a,b) => parseMaxNetwork(b.network) - parseMaxNetwork(a.network));
  else if(by === 'premium') items = items.slice().sort((a,b) => {
    const pa = estAnnual(a), pb = estAnnual(b);
    const va = pa ? pa.annual : Infinity, vb = pb ? pb.annual : Infinity;
    return va - vb;
  });
  return items;
}

    ${state.currentUser.role==='admin' ? '<button class="btn btn-secondary" data-action="open-scheme-manager-dialog">Manage schemes</button>' : ''}
    ${state.currentUser.role==='admin' ? '<button class="btn btn-secondary" data-action="open-user-admin-dialog">Manage logins</button>' : ''}
    <button class="btn btn-secondary" data-action="open-client-dialog">Client details</button>
    <button class="btn btn-secondary" data-action="logout">Log out</button>
  `;
  document.getElementById('modeswitch').querySelectorAll('.seg-opt').forEach(el=>{
    el.addEventListener('click', ()=>{ setMode(el.dataset.mode); });
  });
  document.querySelector('[data-action="open-client-dialog"]').addEventListener('click', openClientDialog);
  document.querySelector('[data-action="logout"]').addEventListener('click', logout);
  const userAdminBtn = document.querySelector('[data-action="open-user-admin-dialog"]');
  if(userAdminBtn) userAdminBtn.addEventListener('click', openUserAdminDialog);
  const schemeManagerBtn = document.querySelector('[data-action="open-scheme-manager-dialog"]');
  if(schemeManagerBtn) schemeManagerBtn.addEventListener('click', openSchemeManagerDialog);
  const backupBtn = document.querySelector('[data-action="open-backup-dialog"]');
  if(backupBtn) backupBtn.addEventListener('click', openBackupDialog);
  const textEditBtn = document.querySelector('[data-action="toggle-text-edit"]');
  if(textEditBtn) textEditBtn.addEventListener('click', toggleTextEditMode);
  renderCategoryBar();
}

function renderCategoryBar(){
  const bar = document.getElementById('category-bar');
  if(!bar) return;
  const opts = categoryOrder.map(key => `
    <button class="cat-opt${state.category===key?' active':''}" data-category="${key}">
      <span class="cat-opt-icon">${CATEGORIES[key].icon}</span>
      <span>${tHtml('data:cat.'+key)}</span>
    </button>
  `).join('');
  bar.innerHTML = `
    <div class="cat-bar">
      <span class="cat-bar-label">${tHtml('catbar.label')}</span>
      <div class="cat-bar-opts">${opts}</div>
    </div>
  `;
  bar.querySelectorAll('[data-category]').forEach(el=>{
    el.addEventListener('click', ()=> setCategory(el.dataset.category));
  });
}

function setCategory(cat){
  if(!CATEGORIES[cat] || state.category === cat) return;
  state.category = cat;
  state.search = '';
  state.filterMinSI = '0';
  state.filterMinNetwork = '0';
  state.filterNoCap = false;
  state.sortBy = 'default';
  state.activeSchemeId = null;
  if(state.mode === 'detail') state.mode = 'browse';
  renderCategoryBar();
  renderSidebar();
  renderMain();
  persistPersonal();
}

function renderSidebar(){
  const cat = state.category;
  const catGroup = CATEGORY_GROUPS[cat] || CATEGORY_GROUPS.health;
  const isHealth = cat === 'health';
  const groups = [];
  catGroup.order.forEach(g=>{
    const items = SCHEMES.filter(s=>s.type===g && (s.category||'health')===cat && bySearch(s));
    if(!items.length) return;
    groups.push({ label: catGroup.labels[g], items });
  });

  const groupsHtml = groups.map(group => `
    <h6 style="color:var(--color-neutral-400);margin:var(--space-3) 0 var(--space-2);">${esc(group.label)}</h6>
    ${group.items.map(item => `
      <button class="nav-item-btn" data-open="${item.id}">
        <span style="display:block;font-weight:500;font-size:13px;">${esc(item.plan)}</span>
        <span style="display:block;font-size:11px;color:var(--color-neutral-500);">${esc(item.insurer)}</span>
      </button>
    `).join('')}
  `).join('');

  const isTerm = cat === 'term';
  const calculatorHtml = isHealth ? `
    <h6 style="color:var(--color-neutral-400);margin-bottom:var(--space-2);">Health premium calculator</h6>
    <div style="display:flex;flex-direction:column;gap:var(--space-2);margin-bottom:var(--space-4);padding:var(--space-3);background:var(--color-bg);border-radius:var(--radius-md);">
      <div class="field"><label>Age</label><input class="input" type="number" min="0" max="99" id="calc-age" value="${esc(state.calcAge)}"/></div>
      <div class="field"><label>Target sum insured</label>
        <select class="input" id="calc-si">
          ${[3,5,10,15,20,25,50,100].map(v=>`<option value="${v}"${String(v)===state.calcSI?' selected':''}>${v===100?'₹1 crore':'₹'+v+' lakh'}</option>`).join('')}
        </select>
      </div>
      <p class="text-muted" style="font-size:11px;margin:0;">Estimate ≈ base rate × sum insured × age loading. Reflected across scheme sections.</p>
    </div>
  ` : isTerm ? `
    <h6 style="color:var(--color-neutral-400);margin-bottom:var(--space-2);">Term premium calculator</h6>
    <div style="display:flex;flex-direction:column;gap:var(--space-2);margin-bottom:var(--space-4);padding:var(--space-3);background:var(--color-bg);border-radius:var(--radius-md);">
      <div class="field"><label>Age</label><input class="input" type="number" min="18" max="65" id="calc-age" value="${esc(state.calcAge)}"/></div>
      <div class="field"><label>Life cover amount</label>
        <select class="input" id="calc-cover">
          ${[[50,'₹50 lakh'],[75,'₹75 lakh'],[100,'₹1 crore'],[150,'₹1.5 crore'],[200,'₹2 crore'],[300,'₹3 crore'],[500,'₹5 crore']].map(([v,l])=>`<option value="${v}"${String(v)===state.calcCover?' selected':''}>${l}</option>`).join('')}
        </select>
      </div>
      <label class="radio"><input type="checkbox" id="calc-smoker" ${state.calcSmoker?'checked':''}/><span class="dot"></span>Tobacco / smoker (≈ +60% loading)</label>
      <p class="text-muted" style="font-size:11px;margin:0;">Estimate ≈ base rate × cover × age × smoker loading.</p>
    </div>
  ` : '';

  const healthOnlyFiltersHtml = isHealth ? `
      <div class="field"><label>Minimum sum insured</label>
        <select class="input" id="filter-min-si">
          ${[['0','Any'],['5','₹5L+'],['10','₹10L+'],['25','₹25L+'],['50','₹50L+'],['100','₹1Cr+']].map(([v,l])=>`<option value="${v}"${v===state.filterMinSI?' selected':''}>${l}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Minimum network hospitals</label>
        <select class="input" id="filter-min-network">
          ${[['0','Any'],['5000','5,000+'],['10000','10,000+'],['15000','15,000+'],['20000','20,000+']].map(([v,l])=>`<option value="${v}"${v===state.filterMinNetwork?' selected':''}>${l}</option>`).join('')}
        </select>
      </div>
      <label class="radio"><input type="checkbox" id="filter-no-cap" ${state.filterNoCap?'checked':''}/><span class="dot"></span>No room-rent capping only</label>
  ` : '';

  const sortOptions = isHealth
    ? [['default','Default order'],['csr','Claim settlement ratio'],['network','Network size'],['premium','Est. premium (low to high)']]
    : isTerm
    ? [['default','Default order'],['csr','Claim settlement ratio'],['premium','Est. premium (low to high)']]
    : [['default','Default order'],['csr','Claim settlement ratio']];

  document.getElementById('sidebar').innerHTML = `
    <div class="field" style="margin-bottom:var(--space-4);">
      <label>Search insurer or scheme</label>
      <input class="input" type="text" id="search-input" placeholder="e.g. Star Health, Optima…" value="${esc(state.search)}"/>
    </div>

    ${calculatorHtml}

    <h6 style="color:var(--color-neutral-400);margin-bottom:var(--space-2);">Filters</h6>
    <div style="display:flex;flex-direction:column;gap:var(--space-2);margin-bottom:var(--space-4);">
      ${healthOnlyFiltersHtml}
      <label class="radio"><input type="checkbox" id="filter-fav-only" ${state.favouritesOnly?'checked':''}/><span class="dot"></span>Favourites only</label>
      <div class="field"><label>Sort by</label>
        <select class="input" id="sort-by">
          ${sortOptions.map(([v,l])=>`<option value="${v}"${v===state.sortBy?' selected':''}>${l}</option>`).join('')}
        </select>
      </div>
    </div>

    <div id="nav-groups">${groupsHtml}</div>
  `;

  document.getElementById('search-input').addEventListener('input', e=>{ state.search = e.target.value; renderSidebar(); renderMain(); persistPersonal(); });
  const calcAgeEl = document.getElementById('calc-age'); if(calcAgeEl) calcAgeEl.addEventListener('change', e=>{ state.calcAge = Number(e.target.value)||0; renderMain(); persistPersonal(); });
  const calcSiEl = document.getElementById('calc-si'); if(calcSiEl) calcSiEl.addEventListener('change', e=>{ state.calcSI = e.target.value; renderMain(); persistPersonal(); });
  const calcCoverEl = document.getElementById('calc-cover'); if(calcCoverEl) calcCoverEl.addEventListener('change', e=>{ state.calcCover = e.target.value; renderMain(); persistPersonal(); });
  const calcSmokerEl = document.getElementById('calc-smoker'); if(calcSmokerEl) calcSmokerEl.addEventListener('change', e=>{ state.calcSmoker = e.target.checked; renderMain(); persistPersonal(); });
  const filterMinSiEl = document.getElementById('filter-min-si'); if(filterMinSiEl) filterMinSiEl.addEventListener('change', e=>{ state.filterMinSI = e.target.value; renderMain(); persistPersonal(); });
  const filterMinNetworkEl = document.getElementById('filter-min-network'); if(filterMinNetworkEl) filterMinNetworkEl.addEventListener('change', e=>{ state.filterMinNetwork = e.target.value; renderMain(); persistPersonal(); });
  const filterNoCapEl = document.getElementById('filter-no-cap'); if(filterNoCapEl) filterNoCapEl.addEventListener('change', e=>{ state.filterNoCap = e.target.checked; renderMain(); persistPersonal(); });
  document.getElementById('filter-fav-only').addEventListener('change', e=>{ state.favouritesOnly = e.target.checked; renderMain(); persistPersonal(); });
  document.getElementById('sort-by').addEventListener('change', e=>{ state.sortBy = e.target.value; renderMain(); persistPersonal(); });
  document.getElementById('sidebar').querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', ()=> openScheme(el.dataset.open));
  });
}

function renderMain(){
  const main = document.getElementById('main');
  if(state.mode === 'browse') main.innerHTML = viewBrowse();
  else if(state.mode === 'detail') main.innerHTML = viewDetail();
  else if(state.mode === 'compare') main.innerHTML = viewCompare();
  else if(state.mode === 'proposal') main.innerHTML = viewProposal();
  else if(state.mode === 'saved') main.innerHTML = viewSaved();
  else if(state.mode === 'dashboard') main.innerHTML = viewDashboard();
  wireMainEvents();
}

function viewBrowse(){
  const schemes = sortedFilteredSchemes();
  const cards = schemes.map(s=>{
    const est = estAnnual(s);
    const fl = fieldLabels(s.category);
    const isFav = state.favIds.includes(s.id);
    const isCmp = state.compareIds.includes(s.id);
    const tagClass = s.type==='govt' ? 'tag-accent-2' : 'tag-accent';
    return `
      <div class="card elev-sm clickable" data-open="${s.id}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <span class="tag ${tagClass}">${esc(TYPES[s.type].label)}</span>
          <div style="display:flex;gap:6px;">
            <button class="btn btn-icon ${isFav?'btn-primary':'btn-secondary'}" title="Favourite" data-fav="${s.id}">${isFav?'★':'☆'}</button>
            <button class="btn btn-icon ${isCmp?'btn-primary':'btn-secondary'}" title="Add to compare" data-cmp="${s.id}">${isCmp?'✓':'+'}</button>
          </div>
        </div>
        <div class="card-title" style="margin-top:var(--space-2);">${esc(s.plan)}</div>
        <div class="card-meta">${esc(s.insurer)}</div>
        <p class="card-body">${esc(s.tagline)}</p>
        <div class="hr" style="margin:var(--space-2) 0;"></div>
        <div style="display:flex;gap:var(--space-4);font-size:12px;">
          <div><b style="display:block;font-size:13px;">${esc(s.sumInsured)}</b><span class="text-muted">${esc(fl.sumInsured)}</span></div>
          <div><b style="display:block;font-size:13px;">${esc(s.network)}</b><span class="text-muted">${esc(fl.network)}</span></div>
          <div><b style="display:block;font-size:13px;">${est ? '₹'+est.annual.toLocaleString('en-IN')+'/yr' : '—'}</b><span class="text-muted">${esc(fl.premium)}</span></div>
        </div>
      </div>`;
  }).join('');

  return `
    <div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--color-divider);padding-bottom:var(--space-3);margin-bottom:var(--space-6);">
      <span class="text-muted" style="font-size:12px;">Browse · ${esc(CATEGORIES[state.category].label)}</span>
      <div style="display:flex;gap:var(--space-2);align-items:center;">
        ${state.currentUser.role==='admin' ? '<button class="btn btn-secondary no-print" data-add-scheme>+ Add scheme</button>' : ''}
        <span class="tag tag-neutral">${schemes.length} ${schemes.length===1?'scheme':'schemes'}</span>
      </div>
    </div>
    <div style="margin-bottom:var(--space-8);max-width:820px;">
      <h1 style="margin-bottom:var(--space-3);">${tTemplate('browse.heading', {type: CATEGORIES[state.category].label})}</h1>
      <p class="text-muted" style="max-width:640px;">${tHtml('browse.intro')}</p>
      <p class="text-muted" style="font-size:12px;border-left:3px solid var(--color-accent-600);padding-left:var(--space-3);max-width:640px;">${tHtml('browse.disclaimer')}</p>
    </div>
    <div class="grid-cards">${cards || '<p class="text-muted">No schemes match your search/filters.</p>'}</div>
  `;
}

/* Enhanced Scheme Detail View with 8 Dedicated Content Sections */

  const premiumLabel = est ? ('₹'+est.annual.toLocaleString('en-IN')+' / yr (≈ ₹'+est.monthly.toLocaleString('en-IN')+' / mo)') : (s.premiumNote || 'Contact insurer for an exact quote');

function buildCompareRows(items){
  const fl = fieldLabels((items[0] && items[0].category) || state.category);
  const rows = [
    ['Insurer / provider type', s=>TYPES[s.type].label],
    [fl.sumInsured, s=>s.sumInsured],
    [fl.entryAge, s=>s.entryAge],
    [fl.csr, s=>s.csr],
    [fl.network, s=>s.network],
    [fl.roomRent, s=>s.roomRent],
    [fl.restoration, s=>s.restoration],
    [fl.waitingPED, s=>s.waitingPED],
    [fl.premium+'*', s=>{ const e = estAnnual(s); return e ? ('₹'+e.annual.toLocaleString('en-IN')) : (s.premiumNote ? 'See notes' : '—'); }],
    ['Best for', s=>s.bestFor]
  ];
  return rows.map(([label,fn]) => ({ label, cells: items.map(s => fn(s)) }));
}

function userDisplayName(username){
  const u = USERS.find(x=>x.username===username);
  return u ? u.displayName : (username || 'Unknown');
}

function visibleProposals(){
  let list;
  if(state.currentUser.role === 'admin'){
    if(state.adminFilterUser && state.adminFilterUser !== 'all'){
      list = state.savedProposals.filter(p => p.createdBy === state.adminFilterUser);
    } else {
      list = state.savedProposals;
    }
  } else {
    list = state.savedProposals.filter(p => p.createdBy === state.currentUser.username);
  }
  if(state.categoryFilter && state.categoryFilter !== 'all'){
    list = list.filter(p => proposalCategories(p).includes(state.categoryFilter));
  }
  return list.filter(matchesDateFilter);
}

function matchesDateFilter(p){
  const type = state.dateFilterType;
  if(!type || type === 'all' || !state.dateFilterValue) return true;
  const d = new Date(p.date);
  if(isNaN(d.getTime())) return true;
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  if(type === 'day') return `${y}-${m}-${day}` === state.dateFilterValue;
  if(type === 'month') return `${y}-${m}` === state.dateFilterValue;
  if(type === 'year') return String(y) === state.dateFilterValue;
  return true;
}

function proposalYearOptions(){
  const years = new Set(state.savedProposals.map(p=>{ const d=new Date(p.date); return isNaN(d.getTime()) ? null : d.getFullYear(); }).filter(y=>y!==null));
  years.add(new Date().getFullYear());
  const sorted = [...years].sort((a,b)=>b-a);
  const cur = state.dateFilterValue || String(new Date().getFullYear());
  return sorted.map(y=>`<option value="${y}"${String(y)===cur?' selected':''}>${y}</option>`).join('');
}

function dateFilterBar(){
  const type = state.dateFilterType || 'all';
  let valueField = '';
  if(type === 'day'){
    valueField = `<div class="field" style="max-width:190px;"><label>Date</label><input class="input" type="date" id="date-filter-value" value="${esc(state.dateFilterValue||'')}"/></div>`;
  } else if(type === 'month'){
    valueField = `<div class="field" style="max-width:190px;"><label>Month</label><input class="input" type="month" id="date-filter-value" value="${esc(state.dateFilterValue||'')}"/></div>`;
  } else if(type === 'year'){
    valueField = `<div class="field" style="max-width:140px;"><label>Year</label><select class="input" id="date-filter-value">${proposalYearOptions()}</select></div>`;
  }
  return `
    <div style="display:flex;gap:var(--space-2);align-items:flex-end;flex-wrap:wrap;margin-bottom:var(--space-4);">
      <div class="field" style="max-width:170px;">
        <label>Filter by date</label>
        <select class="input" id="date-filter-type">
          <option value="all"${type==='all'?' selected':''}>All time</option>
          <option value="day"${type==='day'?' selected':''}>Specific date</option>
          <option value="month"${type==='month'?' selected':''}>Month</option>
          <option value="year"${type==='year'?' selected':''}>Year</option>
        </select>
      </div>
      ${valueField}
      ${type!=='all' ? `<button class="btn btn-secondary" id="date-filter-clear">Clear</button>` : ''}
    </div>
  `;
}

function wireDateFilterBar(){
  const typeEl = document.getElementById('date-filter-type');
  if(typeEl) typeEl.addEventListener('change', e=>{
    state.dateFilterType = e.target.value;
    state.dateFilterValue = '';
    renderMain();
  });
  const valEl = document.getElementById('date-filter-value');
  if(valEl) valEl.addEventListener('change', e=>{
    state.dateFilterValue = e.target.value;
    renderMain();
  });
  const clearEl = document.getElementById('date-filter-clear');
  if(clearEl) clearEl.addEventListener('click', ()=>{
    state.dateFilterType = 'all';
    state.dateFilterValue = '';
    renderMain();
  });
}

function wireCategoryFilterBar(){
  const el = document.getElementById('category-filter');
  if(el) el.addEventListener('change', e=>{ state.categoryFilter = e.target.value; renderMain(); });
}

function proposalCategories(p){
  const set = new Set((p.compareIds || [])
    .map(id => { const s = SCHEMES.find(x=>x.id===id); return s ? (s.category||'health') : null; })
    .filter(Boolean));
  if(!set.size) set.add(p.category || 'health');
  return categoryOrder.filter(k => set.has(k));
}

function categoryTag(p){
  const cats = proposalCategories(p);
  return cats.map(key => {
    const c = CATEGORIES[key] || CATEGORIES.health;
    return `<span class="tag tag-neutral" title="Insurance type">${c.icon} ${esc(c.label)}</span>`;
  }).join(' ');
}

      <div class="card elev-sm">

          <span class="tag ${statusTagClass(p.status)}" style="width:fit-content;">${statusLabel(p.status)}</span>

        <div class="card-title" style="margin-top:var(--space-2);">${esc(p.name)}</div>
        <div class="card-meta">${dateLabel} · ${countLabel}${byLabel ? ' · by '+esc(byLabel) : ''}</div>
        <div class="field" style="margin-top:var(--space-2);">
          <label>Client status</label>
          <select class="input" data-status-for="${p.id}">
            ${['draft','sent','purchased','declined'].map(v=>`<option value="${v}"${v===(p.status||'draft')?' selected':''}>${statusLabel(v)}</option>`).join('')}

      </div>
    `;
  }).join('');

  const scopeNote = state.currentUser.role === 'admin'
    ? 'As admin, you can see proposals saved by every login on the team.'
    : 'This shows only proposals you\'ve saved. Your admin can see everyone\'s.';

  return `
    <div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--color-divider);padding-bottom:var(--space-3);margin-bottom:var(--space-6);">

      ${categoryFilterBar()}
    </div>
    ${dateFilterBar()}
    ${list.length ? '' : `<p class="text-muted" style="max-width:480px;">No saved proposals yet. Build one under Proposal and click "Save proposal".</p>`}
    <div class="grid-cards-sm">${cards}</div>
  `;
}

function buildPerLoginBreakdown(){
  return USERS.filter(u=>u.role!=='admin').map(u=>{
    const list = state.savedProposals.filter(p=>p.createdBy===u.username);
    const purchased = list.filter(p=>p.status==='purchased').length;
    const sent = list.filter(p=>p.status==='sent').length;
    const declined = list.filter(p=>p.status==='declined').length;
    return { username:u.username, displayName:u.displayName, total:list.length, purchased, sent, declined };
  });
}

function viewDashboard(){
  const list = visibleProposals();
  const purchased = list.filter(p=>p.status==='purchased').length;
  const sent = list.filter(p=>p.status==='sent').length;
  const declined = list.filter(p=>p.status==='declined').length;
  const total = list.length;
  const conversionLabel = total>0 ? Math.round(purchased/total*100)+'%' : '—';
  const isAdmin = state.currentUser.role === 'admin';

  const rows = list.map(p=>{
    const countLabel = p.compareIds.length + (p.compareIds.length===1?' scheme':' schemes');
    const dateLabel = new Date(p.date).toLocaleDateString('en-IN',{year:'numeric',month:'short',day:'numeric'});
    const byLabel = p.createdByDisplay || (p.client && p.client.advisor) || '—';
    return `
      <tr>
        <td>${esc(p.name)}</td>
        <td>${categoryTag(p)}</td>
        <td>${dateLabel}</td>
        <td>${countLabel}</td>
        <td>${esc(byLabel)}</td>
        <td><span class="tag ${statusTagClass(p.status)}">${statusLabel(p.status)}</span></td>
        <td><button class="btn btn-secondary" data-load-proposal="${p.id}">Open</button></td>
      </tr>
    `;
  }).join('');

  const scopeNote = isAdmin
    ? 'This tracks every proposal saved by anyone on the team, shared across the whole workspace.'
    : 'This tracks proposals you\'ve saved. Your admin has a team-wide view.';

  const breakdown = isAdmin ? (()=>{
    const rowsB = buildPerLoginBreakdown().map(b=>`
      <tr>
        <td>${esc(b.displayName)}</td>
        <td>${b.total}</td>
        <td>${b.purchased}</td>
        <td>${b.sent}</td>
        <td>${b.declined}</td>
        <td>${b.total>0 ? Math.round(b.purchased/b.total*100)+'%' : '—'}</td>
      </tr>
    `).join('');
    return `
      <h4>Breakdown by login</h4>
      <div style="overflow-x:auto;border:1px solid var(--color-divider);border-radius:var(--radius-md);margin-bottom:var(--space-6);">
        <table class="table" style="min-width:560px;">
          <thead><tr><th>Login</th><th>Saved</th><th>Purchased</th><th>Sent</th><th>Declined</th><th>Conversion</th></tr></thead>
          <tbody>${rowsB}</tbody>
        </table>
      </div>
    `;
  })() : '';

  const draft = total - purchased - sent - declined;
  const pct = n => total>0 ? Math.round(n/total*100) : 0;
  const statusBar = total>0 ? `
    <div class="status-bar">
      ${purchased?`<span class="seg-purchased" style="width:${pct(purchased)}%;"></span>`:''}
      ${sent?`<span class="seg-sent" style="width:${pct(sent)}%;"></span>`:''}
      ${declined?`<span class="seg-declined" style="width:${pct(declined)}%;"></span>`:''}
      ${draft?`<span class="seg-draft" style="width:${pct(draft)}%;"></span>`:''}
    </div>
    <div class="status-legend">
      <span><i class="dot-sq" style="background:var(--color-accent-2-600);"></i>Purchased (${purchased})</span>
      <span><i class="dot-sq" style="background:var(--color-accent-500);"></i>Sent (${sent})</span>
      <span><i class="dot-sq" style="background:#ef4444;"></i>Declined (${declined})</span>
      <span><i class="dot-sq" style="background:var(--color-neutral-400);"></i>Draft (${draft})</span>
    </div>
  ` : '';

  return `
    <div class="dash-hero">
      <div>
        <h2>${isAdmin ? tHtml('dash.titleAdmin') : tHtml('dash.titleUser')}</h2>
        <p>${scopeNote}</p>
      </div>
      <div style="display:flex;gap:var(--space-2);flex-wrap:wrap;">
        <button class="btn btn-secondary" style="background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.3);color:#fff;" data-refresh-shared>↻ Refresh</button>
        <button class="btn btn-primary" style="background:#fff;color:var(--color-accent-900);" data-download-csv>⭳ Download CSV file</button>
      </div>
    </div>
    <div style="display:flex;gap:var(--space-3);flex-wrap:wrap;align-items:flex-start;">
      ${adminFilterBar()}
      ${categoryFilterBar()}
    </div>
    ${dateFilterBar()}
    <div class="grid-stats">
      <div class="stat-card stat-blue"><div class="stat-icon">📄</div><div class="stat-value">${isAdmin && state.adminFilterUser==='all' ? state.totalCreated : total}</div><div class="stat-label">Total created</div></div>
      <div class="stat-card stat-blue"><div class="stat-icon">🗂</div><div class="stat-value">${total}</div><div class="stat-label">Currently saved</div></div>
      <div class="stat-card stat-green"><div class="stat-icon">✅</div><div class="stat-value">${purchased}</div><div class="stat-label">Purchased</div></div>
      <div class="stat-card stat-amber"><div class="stat-icon">✉️</div><div class="stat-value">${sent}</div><div class="stat-label">Sent</div></div>
      <div class="stat-card stat-red"><div class="stat-icon">✕</div><div class="stat-value">${declined}</div><div class="stat-label">Declined</div></div>
      <div class="stat-card stat-blue"><div class="stat-icon">📈</div><div class="stat-value">${conversionLabel}</div><div class="stat-label">Conversion rate</div></div>
    </div>
    ${statusBar}
    ${breakdown}
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:var(--space-2);">
      <h4>All proposals</h4>
      <button class="btn btn-primary" data-download-csv>⭳ Download CSV file</button>
    </div>
    ${total===0 ? '<p class="text-muted">No proposals saved yet.</p>' : ''}
    <div style="overflow-x:auto;border:1px solid var(--color-divider);border-radius:var(--radius-md);">
      <table class="table" style="min-width:640px;">
        <thead><tr><th>Client / proposal</th><th>Insurance type</th><th>Date</th><th>Schemes</th><th>Created by</th><th>Status</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

}
function openScheme(id){

function backToBrowse(){ state.mode = 'browse'; state.activeSchemeId = null; renderNav(); renderMain(); }

function toggleCompare(id){
  const set = new Set(state.compareIds);
  if(set.has(id)) set.delete(id);
  else {
    const scheme = SCHEMES.find(s=>s.id===id);
    const cat = scheme ? (scheme.category||'health') : 'health';
    const inSameCat = [...set].filter(x => { const s = SCHEMES.find(y=>y.id===x); return s && (s.category||'health') === cat; }).length;
    if(inSameCat >= 6){ showToast('You can compare up to 6 schemes per insurance type'); return; }
    set.add(id);
  }
  state.compareIds = [...set];
  renderNav(); renderMain(); persistPersonal();
}
function toggleFav(id){
  const set = new Set(state.favIds);
  if(set.has(id)) set.delete(id); else set.add(id);
  state.favIds = [...set];
  renderMain(); persistPersonal();
}
function setNote(id, text){
  state.notes = Object.assign({}, state.notes, { [id]: text });
  persistPersonal();
}

async function confirmSaveProposal(){
  const name = (state.saveNameInput || '').trim() || ('Proposal ' + new Date().toLocaleDateString('en-IN'));
  const entry = {
    id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    name, date: new Date().toISOString(), status: 'draft', category: state.category,
    compareIds: [...state.compareIds], client: Object.assign({}, state.client), notes: Object.assign({}, state.notes),
    createdBy: state.currentUser.username, createdByDisplay: state.currentUser.displayName
  };
  state.showSaveDialog = false;
  renderDialogs();
  await loadShared();
  const previous = { proposals: state.savedProposals, totalCreated: state.totalCreated };
  state.savedProposals = [entry, ...state.savedProposals];
  state.totalCreated = (state.totalCreated || 0) + 1;
  const ok = await persistShared();
  if(!ok){
    state.savedProposals = previous.proposals;
    state.totalCreated = previous.totalCreated;
    renderMain();
    showToast('Could not save — team storage is unavailable right now.');
    return;
  }
  renderMain();
  showToast('Proposal saved — visible to your whole team');
}

function canManage(p){
  return state.currentUser.role === 'admin' || p.createdBy === state.currentUser.username;
}

async function setProposalStatus(id, status){
  await loadShared();
  const target = state.savedProposals.find(p=>p.id===id);
  if(!target || !canManage(target)){ showToast('You can only update your own proposals'); renderMain(); return; }
  const previous = state.savedProposals;
  state.savedProposals = state.savedProposals.map(p => p.id === id ? Object.assign({}, p, {status}) : p);
  const ok = await persistShared();
  if(!ok){
    state.savedProposals = previous;
    renderMain();
    showToast('Could not update status — team storage is unavailable.');
    return;
  }
  renderMain();
}

async function loadProposal(id){
  await loadShared();
  const p = state.savedProposals.find(x => x.id === id);
  if(!p) { showToast('Could not find that proposal'); renderMain(); return; }
  if(!canManage(p)){ showToast('You can only open your own proposals'); renderMain(); return; }
  state.compareIds = [...p.compareIds];
  state.client = Object.assign({}, p.client);
  state.notes = Object.assign({}, p.notes);
  state.category = proposalCategories(p)[0] || 'health';
  state.mode = 'proposal';
  renderNav(); renderMain();
  persistPersonal();
  showToast('Proposal loaded');
}

async function deleteProposal(id){
  await loadShared();
  const target = state.savedProposals.find(p=>p.id===id);
  if(!target || !canManage(target)){ showToast('You can only delete your own proposals'); renderMain(); return; }
  const previous = state.savedProposals;
  state.savedProposals = state.savedProposals.filter(x => x.id !== id);
  const ok = await persistShared();
  if(!ok){
    state.savedProposals = previous;
    renderMain();
    showToast('Could not delete proposal.');
    return;
  }
  renderMain();
  showToast('Proposal deleted');
}

let html2canvasLoading = null;
function loadHtml2Canvas(){
  if(window.html2canvas) return Promise.resolve(window.html2canvas);
  if(html2canvasLoading) return html2canvasLoading;
  html2canvasLoading = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload = ()=> window.html2canvas ? resolve(window.html2canvas) : reject(new Error('html2canvas missing'));
    s.onerror = ()=> { html2canvasLoading = null; reject(new Error('script load failed')); };
    document.head.appendChild(s);
  });
  return html2canvasLoading;
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 4000);
}

async function saveAsImage(captureId, baseName){
  const el = document.getElementById(captureId);
  if(!el){ showToast('Nothing to capture on this page'); return; }
  showToast('Preparing image…', 8000);
  try{
    const h2c = await loadHtml2Canvas();
    const canvas = await h2c(el, {
      scale: 2,
      backgroundColor: '#ffffff',
      useCORS: true,
      allowTaint: true,
      logging: false,
      windowWidth: Math.max(el.scrollWidth, 940),
      onclone: (clonedDoc) => {
        clonedDoc.querySelectorAll('.no-print').forEach(n => { n.style.display = 'none'; });
      }
    });
    const stamp = new Date().toISOString().slice(0,10);
    const filename = baseName + '-' + stamp + '.png';
    canvas.toBlob(blob => {
      if(!blob){ showToast('Could not create image blob'); return; }
      downloadBlob(blob, filename);
      showToast('Image downloaded — ready to share');
    }, 'image/png');
  }catch(e){
    showToast('Could not create image — use "Print / save as PDF" instead');
  }
}

function collectStyles(){
  return [...document.querySelectorAll('style')].map(s => s.textContent).join('\n');
}

function buildStandaloneDoc(captureId, title){
  const el = document.getElementById(captureId);
  if(!el) return null;
  return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + esc(title) + '</title>'
    + '<style>' + collectStyles() + '</style>'
    + '<style>body{background:#fff !important;margin:0;padding:24px;} .no-print{display:none !important;} .app-root{background:#fff !important;} #' + captureId + '{max-width:940px;margin:0 auto;} *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;}</style>'
    + '</head><body><div class="app-root">' + el.outerHTML + '</div></body></html>';
}

function printCapture(captureId, title){
  const docHtml = buildStandaloneDoc(captureId, title);
  if(!docHtml){
    try{ window.print(); }catch(e){}
    return;
  }
  let w = null;
  try{ w = window.open('', '_blank'); }catch(e){ w = null; }
  if(w && w.document){
    try{
      w.document.open();
      w.document.write(docHtml);
      w.document.close();
      setTimeout(()=>{ try{ w.focus(); w.print(); }catch(e){} }, 500);
      showToast('Opened in a new window — use print dialog to save as PDF');
      return;
    }catch(e){}
  }
  try{ window.print(); }catch(e){}
}

function buildProposalsCsv(list){
  const cols = ['Proposal name','Insurance type','Client name','Age','Family size','City','Advisor','Created by','Status','Date created','Schemes count','Schemes list','Advisor notes'];
  const rows = list.map(p=>{
    const names = (p.compareIds || []).map(id => { const s = SCHEMES.find(x=>x.id===id); return s ? s.plan : id; });
    const notesJoined = Object.values(p.notes || {}).filter(Boolean).join(' | ');
    const catLabel = proposalCategories(p).map(k => CATEGORIES[k].label).join('; ');
    return [
      p.name, catLabel, p.client && p.client.name, p.client && p.client.age, p.client && p.client.family,
      p.client && p.client.city, p.client && p.client.advisor, p.createdByDisplay || '', statusLabel(p.status),
      new Date(p.date).toLocaleDateString('en-IN'), names.length, names.join('; '), notesJoined
    ];
  });
  return [cols, ...rows].map(r => r.map(csvEscape).join(',')).join('\r\n');
}

async function copyTextToClipboard(text, fallbackTextareaId){
  let ok = false;
  try{
    if(navigator && navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      ok = true;
    }
  }catch(e){ ok = false; }
  if(!ok && fallbackTextareaId){
    try{
      const ta = document.getElementById(fallbackTextareaId);
      if(ta){ ta.focus(); ta.select(); ok = document.execCommand('copy'); }
    }catch(e){ ok = false; }
  }
  return ok;
}

async function copyExportCsv(){
  const ok = await copyTextToClipboard(state.exportCsvText || '', 'export-csv-textarea');
  showToast(ok ? 'Copied — paste into Excel or Notepad' : 'Select text below and press Ctrl/Cmd+C');
}

function downloadProposalsCsv(){
  const list = visibleProposals();
  if(!list.length){ showToast('Nothing to download — save a proposal first'); return; }
  const csv = buildProposalsCsv(list);
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const stamp = new Date().toISOString().slice(0,10);
  downloadBlob(blob, `fortune-proposals-${stamp}.csv`);
  showToast(`Downloaded ${list.length} proposal${list.length===1?'':'s'} as CSV`);
}

}
function closeSchemeEdit(){
  state.showSchemeEditDialog = false;
  state.schemeEditTargetId = null;
  state.schemeEditDraft = null;
  renderDialogs();
}

function draftToScheme(d, id){
  return {
    id,
    category: d.category,
    type: (CATEGORY_GROUPS[d.category] || CATEGORY_GROUPS.health).order.includes(d.type) ? d.type : (CATEGORY_GROUPS[d.category] || CATEGORY_GROUPS.health).order[0],
    insurer: (d.insurer||'').trim(),
    plan: (d.plan||'').trim(),
    tagline: (d.tagline||'').trim(),
    csr: (d.csr||'').trim() || '—',
    network: (d.network||'').trim() || '—',
    sumInsured: (d.sumInsured||'').trim() || '—',
    entryAge: (d.entryAge||'').trim() || '—',
    roomRent: (d.roomRent||'').trim() || '—',
    restoration: (d.restoration||'').trim() || '—',
    waitingPED: (d.waitingPED||'').trim() || '—',
    ratePerLakh: Math.max(0, Number(d.ratePerLakh) || 0),
    termRatePerLakh: Math.max(0, Number(d.termRatePerLakh) || 0),
    features: (d.featuresText||'').split('\n').map(x=>x.trim()).filter(Boolean),
    bestFor: (d.bestFor||'').trim() || '—',
    premiumNote: (d.premiumNote||'').trim() || 'Confirm terms and pricing with insurer.'
  };
}

async function saveSchemeEdit(){
  if(state.currentUser.role !== 'admin') return;
  const d = state.schemeEditDraft;
  if(!d) return;
  if(!(d.insurer||'').trim() || !(d.plan||'').trim()){ showToast('Insurer and plan name required'); return; }
  const targetId = state.schemeEditTargetId;
  const previous = JSON.parse(JSON.stringify(state.schemeCustom));
  if(!targetId){
    const id = 'custom_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
    state.schemeCustom.custom = [...(state.schemeCustom.custom||[]), draftToScheme(d, id)];
  } else if((state.schemeCustom.custom||[]).some(s=>s.id===targetId)){
    state.schemeCustom.custom = state.schemeCustom.custom.map(s => s.id===targetId ? draftToScheme(d, targetId) : s);
  } else {
    state.schemeCustom.overrides = Object.assign({}, state.schemeCustom.overrides, { [targetId]: draftToScheme(d, targetId) });
  }
  rebuildSchemes();
  const ok = await persistSchemeCustomizations();
  if(!ok){
    state.schemeCustom = previous;
    rebuildSchemes();
    showToast('Could not save scheme change.');
    return;
  }
  state.showSchemeEditDialog = false;
  state.schemeEditTargetId = null;
  state.schemeEditDraft = null;
  renderSidebar(); renderMain(); renderDialogs();
  showToast(targetId ? 'Scheme updated' : 'Scheme added');
}

async function deleteScheme(id){
  if(state.currentUser.role !== 'admin') return;
  if(state.schemeDeletePending !== id){
    state.schemeDeletePending = id;
    renderDialogs();
    return;
  }
  const previous = JSON.parse(JSON.stringify(state.schemeCustom));
  if((state.schemeCustom.custom||[]).some(s=>s.id===id)){
    state.schemeCustom.custom = state.schemeCustom.custom.filter(s=>s.id!==id);
    delete (state.schemeCustom.overrides||{})[id];
  } else {
    state.schemeCustom.deleted = [...new Set([...(state.schemeCustom.deleted||[]), id])];
  }
  state.schemeDeletePending = null;
  rebuildSchemes();
  const ok = await persistSchemeCustomizations();
  if(!ok){
    state.schemeCustom = previous;
    rebuildSchemes();
    renderDialogs();
    showToast('Could not delete scheme.');
    return;
  }
  renderSidebar(); renderMain(); renderDialogs();
  showToast('Scheme deleted');
}

async function restoreScheme(id){
  if(state.currentUser.role !== 'admin') return;
  const previous = JSON.parse(JSON.stringify(state.schemeCustom));
  state.schemeCustom.deleted = (state.schemeCustom.deleted||[]).filter(x=>x!==id);
  rebuildSchemes();
  const ok = await persistSchemeCustomizations();
  if(!ok){
    state.schemeCustom = previous;
    rebuildSchemes();
    showToast('Could not restore scheme.');
    return;
  }
  renderSidebar(); renderMain(); renderDialogs();
  showToast('Scheme restored');
}

function toggleTextEditMode(){
  if(state.currentUser.role !== 'admin') return;
  state.textEditMode = !state.textEditMode;
  renderNav(); renderSidebar(); renderMain(); renderDialogs();
  if(state.textEditMode) showToast('Edit mode on — click any highlighted text to change it.');
}

function renderTextEditBanner(){
  let banner = document.getElementById('text-edit-banner');
  if(!textEditActive()){
    if(banner) banner.remove();
    return;
  }
  if(!banner){
    banner = document.createElement('div');
    banner.id = 'text-edit-banner';
    banner.className = 'text-edit-banner no-print';
    document.body.appendChild(banner);
  }
  banner.innerHTML = '✏️ Text edit mode — click any highlighted text <button data-banner-all-texts>📝 All texts</button> <button data-banner-done>Done</button>';
  banner.querySelector('[data-banner-all-texts]').addEventListener('click', ()=>{ state.showAllTextsDialog = true; renderDialogs(); });
  banner.querySelector('[data-banner-done]').addEventListener('click', toggleTextEditMode);
}

function openTextEdit(key){
  if(!textEditActive() || !TEXT_REGISTRY[key]) return;
  state.textEditKey = key;
  state.showTextEditDialog = true;
  renderDialogs();
}
function closeTextEdit(){
  state.showTextEditDialog = false;
  state.textEditKey = null;
  renderDialogs();
}
async function saveTextEdit(){
  const key = state.textEditKey;
  const ta = document.getElementById('text-edit-value');
  if(!key || !ta) return;
  const value = ta.value.trim();
  if(!value){ showToast('Text cannot be empty'); return; }
  const previous = Object.assign({}, TEXT_OVERRIDES);
  if(value === (TEXT_REGISTRY[key] ? TEXT_REGISTRY[key].def : '')) delete TEXT_OVERRIDES[key];
  else TEXT_OVERRIDES[key] = value;
  applyDataTextOverrides();
  const ok = await persistTextOverrides();
  if(!ok){
    TEXT_OVERRIDES = previous;
    applyDataTextOverrides();
    showToast('Could not save text.');
    return;
  }
  state.showTextEditDialog = false;
  state.textEditKey = null;
  renderNav(); renderSidebar(); renderMain(); renderDialogs();
  showToast('Text updated team-wide');
}
async function resetTextEdit(){
  const key = state.textEditKey;
  if(!key) return;
  const previous = Object.assign({}, TEXT_OVERRIDES);
  delete TEXT_OVERRIDES[key];
  applyDataTextOverrides();
  const ok = await persistTextOverrides();
  if(!ok){
    TEXT_OVERRIDES = previous;
    applyDataTextOverrides();
    showToast('Could not reset text.');
    return;
  }
  state.showTextEditDialog = false;
  state.textEditKey = null;
  renderNav(); renderSidebar(); renderMain(); renderDialogs();
  showToast('Text reset to default');
}

function openBackupDialog(){
  if(state.currentUser.role !== 'admin') return;
  state.showBackupDialog = true;
  renderDialogs();
}
function closeBackupDialog(){
  state.showBackupDialog = false;
  renderDialogs();
}

async function exportBackup(){
  try{
    const personal = {};
    for(const u of USERS){
      const p = await storageGet('insurance-app-personal-v1:' + u.username, true);
      if(p) personal[u.username] = p;
    }
    const bundle = {
      app: 'fortune-insurance-workspace', version: 1, exportedAt: new Date().toISOString(),
      users: USERS, shared: { proposals: state.savedProposals, totalCreated: state.totalCreated },
      schemeCustom: state.schemeCustom, personal
    };
    const stamp = new Date().toISOString().slice(0,10);
    downloadBlob(new Blob([JSON.stringify(bundle, null, 2)], {type:'application/json'}), 'fortune-workspace-backup-' + stamp + '.json');
    showToast('Backup downloaded');
  }catch(e){ showToast('Could not export backup'); }
}

async function importBackup(){
  const input = document.getElementById('backup-file-input');
  const file = input && input.files && input.files[0];
  if(!file){ showToast('Select a backup file'); return; }
  let bundle;
  try{ bundle = JSON.parse(await file.text()); }catch(e){ showToast('Invalid JSON backup file'); return; }
  if(!bundle || bundle.app !== 'fortune-insurance-workspace'){ showToast('Not a valid workspace backup file'); return; }
  try{
    if(Array.isArray(bundle.users) && bundle.users.length){ USERS = bundle.users; await persistUsers(); }
    if(bundle.shared){
      state.savedProposals = Array.isArray(bundle.shared.proposals) ? bundle.shared.proposals : [];
      state.totalCreated = Number(bundle.shared.totalCreated) || state.savedProposals.length;
      await persistShared();
    }
    if(bundle.schemeCustom){
      state.schemeCustom = {
        custom: Array.isArray(bundle.schemeCustom.custom) ? bundle.schemeCustom.custom : [],
        overrides: bundle.schemeCustom.overrides || {},
        deleted: Array.isArray(bundle.schemeCustom.deleted) ? bundle.schemeCustom.deleted : []
      };
      rebuildSchemes();
      await persistSchemeCustomizations();
    }
    if(bundle.personal && typeof bundle.personal === 'object'){
      for(const [username, payload] of Object.entries(bundle.personal)){
        await storageSet('insurance-app-personal-v1:' + username, payload, true);
      }
      await loadPersonal();
    }
    state.showBackupDialog = false;
    renderNav(); renderSidebar(); renderMain(); renderDialogs();
    showToast('Backup restored successfully');
  }catch(e){ showToast('Restore failed'); }
}

function openUserAdminDialog(){
  if(state.currentUser.role !== 'admin') return;
  state.showUserAdminDialog = true;
  renderDialogs();
}
function closeUserAdminDialog(){
  state.showUserAdminDialog = false;
  renderDialogs();
}

async function saveUserRow(index){
  if(state.currentUser.role !== 'admin') return;
  const row = document.querySelector(`[data-ua-row="${index}"]`);
  if(!row || !USERS[index]) return;

  const newUsername = (row.querySelector('[data-ua-field="username"]').value || '').trim();
  const newDisplayName = (row.querySelector('[data-ua-field="displayName"]').value || '').trim();
  const newPassword = row.querySelector('[data-ua-field="password"]').value || '';

  if(!newUsername || !newDisplayName){ showToast('Username and Display name required'); return; }
  const clash = USERS.some((u,i)=> i!==index && u.username.toLowerCase() === newUsername.toLowerCase());
  if(clash){ showToast('Username already exists'); return; }

  const oldUsername = USERS[index].username;
  const previous = USERS;
  USERS = USERS.map((u,i)=> i===index ? Object.assign({}, u, {
    username: newUsername, displayName: newDisplayName, password: newPassword ? newPassword : u.password
  }) : u);

  const ok = await persistUsers();
  if(!ok){ USERS = previous; showToast('Could not save user changes'); return; }

  if(state.currentUser.username === oldUsername){
    state.currentUser.username = newUsername;
    state.currentUser.displayName = newDisplayName;
    renderNav();
  }

  showToast(`Updated login for ${newDisplayName}`);
  renderDialogs();
}

function renderLogin(){
  document.getElementById('login-root').innerHTML = `
    <div class="login-wrap">
      <div class="login-shell">
        <div class="login-brand-panel">
          <div>
            <div class="login-brand-mark">
              <img src="${LOGO_DATA_URI}" alt="Fortune Investment Services Pvt Ltd" style="height:30px;width:auto;filter:brightness(0) invert(1);"/>
            </div>
            <div class="login-brand-tagline">${esc(t('login.tagline'))}</div>
            <ul class="login-brand-points">
              <li><span class="ico">✓</span> ${esc(t('login.point1'))}</li>
              <li><span class="ico">✓</span> ${esc(t('login.point2'))}</li>
              <li><span class="ico">✓</span> ${esc(t('login.point3'))}</li>
            </ul>
            <div class="login-brand-about">
              <h6>${esc(t('login.aboutTitle'))}</h6>
              ${esc(t('login.aboutBody'))}
              <div class="login-brand-stats">
                <div><div class="num">${esc(t('login.stat1num'))}</div><div class="lbl">${esc(t('login.stat1lbl'))}</div></div>
                <div><div class="num">${esc(t('login.stat2num'))}</div><div class="lbl">${esc(t('login.stat2lbl'))}</div></div>
                <div><div class="num">${esc(t('login.stat3num'))}</div><div class="lbl">${esc(t('login.stat3lbl'))}</div></div>
              </div>
            </div>
          </div>
          <div class="login-brand-foot">Fortune Investment Services Pvt Ltd &middot; ${storageModeLabel()}</div>
        </div>
        <div class="login-form-panel">
          <div class="card login-card">
            <h3 style="margin-bottom:var(--space-1);">${esc(t('login.welcome'))}</h3>
            <p class="text-muted" style="font-size:12.5px;margin-bottom:var(--space-4);">${esc(t('login.welcomeSub'))}</p>
            ${state.loginError ? `<div class="login-error">${esc(state.loginError)}</div>` : ''}
            <div class="field" style="margin-bottom:var(--space-3);"><label>Username</label><input class="input" id="login-username" type="text" autocomplete="username" placeholder="e.g. fortune.rahul"/></div>
            <div class="field" style="margin-bottom:var(--space-4);"><label>Password</label><input class="input" id="login-password" type="password" autocomplete="current-password"/></div>
            <button class="btn btn-primary btn-block" id="login-submit">Sign in</button>
          </div>
        </div>
      </div>
    </div>
  `;
  const submit = document.getElementById('login-submit');
  const userInput = document.getElementById('login-username');
  const passInput = document.getElementById('login-password');
  submit.addEventListener('click', attemptLogin);
  passInput.addEventListener('keydown', e => { if(e.key === 'Enter') attemptLogin(); });
  userInput.addEventListener('keydown', e => { if(e.key === 'Enter') passInput.focus(); });
  userInput.focus();
}

async function attemptLogin(){
  const u = (document.getElementById('login-username').value || '').trim();
  const p = document.getElementById('login-password').value || '';
  await loadUsers();
  const match = USERS.find(x => x.username.toLowerCase() === u.toLowerCase() && x.password === p);
  if(!match){
    state.loginError = 'Incorrect username or password.';
    renderLogin();
    return;
  }
  state.loginError = null;
  state.currentUser = { username: match.username, displayName: match.displayName, role: match.role };
  document.getElementById('login-root').innerHTML = '';
  document.getElementById('app-root').style.display = 'flex';
  await boot();
}

function logout(){
  state.currentUser = null;
  state.mode = 'browse';
  state.activeSchemeId = null;
  state.adminFilterUser = 'all';
  state.dateFilterType = 'all';
  state.dateFilterValue = '';
  state.showUserAdminDialog = false;
  state.showSchemeManagerDialog = false;
  state.showSchemeEditDialog = false;
  state.schemeEditTargetId = null;
  state.schemeEditDraft = null;
  state.schemeDeletePending = null;
  state.showBackupDialog = false;
  state.textEditMode = false;
  state.showTextEditDialog = false;
  state.textEditKey = null;
  state.showAllTextsDialog = false;
  Object.assign(state, defaultPersonal());
  document.getElementById('app-root').style.display = 'none';
  document.getElementById('main').innerHTML = '';
  document.getElementById('dialogs').innerHTML = '';
  document.getElementById('toast-holder').innerHTML = '';
  renderLogin();
}

async function boot(){
  document.getElementById('main').innerHTML = `<p class="text-muted">Loading workspace…</p>`;
  await loadUsers();
  await loadPersonal();
  await loadShared();
  state.ready = true;
  renderNav(); renderSidebar(); renderMain(); renderDialogs(); renderToast();
}

async function init(){
  await detectStorageMode();
  await loadTextOverrides();
  await loadUsers();
  renderLogin();
}

document.addEventListener('click', e=>{
  if(!textEditActive()) return;
  const el = e.target.closest('.t-edit');
  if(!el) return;
  e.preventDefault();
  e.stopPropagation();
  openTextEdit(el.dataset.tkey);
}, true);

init();

</script>
